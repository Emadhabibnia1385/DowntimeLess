<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="DowntimeLess: master server watching a fleet of VPN servers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1210"/><stop offset="1" stop-color="#17221C"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g stroke="#344A2D" stroke-width="2" fill="none" stroke-dasharray="6 8">
    <path d="M600 150 L250 270"/><path d="M600 150 L470 270"/><path d="M600 150 L730 270"/><path d="M600 150 L950 270"/>
  </g>
  <rect x="520" y="86" width="160" height="78" rx="14" fill="#17221C" stroke="url(#ribbon)" stroke-width="3"/>
  <text x="600" y="133" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F4F8F2">MASTER</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#F4F8F2" text-anchor="middle">
    <rect x="190" y="262" width="120" height="52" rx="10" fill="#17221C" stroke="#A3E635"/><text x="250" y="294">relay</text>
    <rect x="410" y="262" width="120" height="52" rx="10" fill="#17221C" stroke="#A3E635"/><text x="470" y="294">relay</text>
    <rect x="670" y="262" width="120" height="52" rx="10" fill="#17221C" stroke="#A3E635"/><text x="730" y="294">exit</text>
    <rect x="890" y="262" width="120" height="52" rx="10" fill="#17221C" stroke="#A3E635"/><text x="950" y="294">exit</text>
  </g>
  <text x="600" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#A9B8A4">one agent per server · outbound only · measured, not guessed</text>
</svg>
