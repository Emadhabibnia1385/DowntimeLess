<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="DowntimeLess: master server watching a fleet of VPN servers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#10243a"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g stroke="#2a4a66" stroke-width="2" fill="none" stroke-dasharray="6 8">
    <path d="M600 150 L250 270"/><path d="M600 150 L470 270"/><path d="M600 150 L730 270"/><path d="M600 150 L950 270"/>
  </g>
  <rect x="520" y="86" width="160" height="78" rx="14" fill="#0f2a44" stroke="url(#ribbon)" stroke-width="3"/>
  <text x="600" y="133" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6f6ff">MASTER</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#cfe9f7" text-anchor="middle">
    <rect x="190" y="262" width="120" height="52" rx="10" fill="#0f2a44" stroke="#a3e635"/><text x="250" y="294">relay</text>
    <rect x="410" y="262" width="120" height="52" rx="10" fill="#0f2a44" stroke="#a3e635"/><text x="470" y="294">relay</text>
    <rect x="670" y="262" width="120" height="52" rx="10" fill="#0f2a44" stroke="#22d3ee"/><text x="730" y="294">exit</text>
    <rect x="890" y="262" width="120" height="52" rx="10" fill="#0f2a44" stroke="#22d3ee"/><text x="950" y="294">exit</text>
  </g>
  <text x="600" y="48" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="url(#ribbon)">DowntimeLess</text>
  <text x="600" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#8fb4cc">one agent per server · outbound only · measured, not guessed</text>
</svg>
