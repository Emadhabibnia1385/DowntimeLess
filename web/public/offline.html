<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1210" />
    <title>اتصال برقرار نیست | DowntimeLess</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      html { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b1210;
        color: #f4f8f2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 16rem; max-width: 100%; height: auto; }
      h1 { margin: 8px 0 4px; font-size: 1.4rem; }
      p { margin: 0 0 20px; color: #b3c3af; }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 10px 22px;
        min-height: 44px;
        background: #a3e635;
        color: #0b1210;
      }
      button:focus-visible { outline: 2px solid #f4f8f2; outline-offset: 3px; }
      @media (prefers-color-scheme: light) {
        body { background: #f7faf5; color: #142019; }
        p { color: #4c5e50; }
        button { background: #3f6e18; color: #ffffff; }
        button:focus-visible { outline-color: #142019; }
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="/brand/logo-light.webp" media="(prefers-color-scheme: light)" />
        <img src="/brand/logo-dark.webp" alt="لوگوی DowntimeLess" width="1200" height="339" />
      </picture>
      <h1>اتصال برقرار نیست</h1>
      <p>اینترنت دستگاه شما قطع است یا پنل در دسترس نیست. اتصال را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
